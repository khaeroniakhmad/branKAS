<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="vaultBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="dialRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="76" y="76" width="360" height="360" rx="48" fill="url(#vaultBody)" filter="url(#shadow)"/>
  <rect x="88" y="88" width="336" height="336" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <circle cx="116" cy="116" r="8" fill="#ffffff" opacity="0.4"/>
  <circle cx="396" cy="116" r="8" fill="#ffffff" opacity="0.4"/>
  <circle cx="116" cy="396" r="8" fill="#ffffff" opacity="0.4"/>
  <circle cx="396" cy="396" r="8" fill="#ffffff" opacity="0.4"/>

  <circle cx="256" cy="256" r="110" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="100" fill="url(#dialRing)"/>
  <circle cx="256" cy="256" r="84" fill="#1e293b"/>

  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="180" x2="256" y2="188"/>
    <line x1="256" y1="324" x2="256" y2="332"/>
    <line x1="180" y1="256" x2="188" y2="256"/>
    <line x1="324" y1="256" x2="332" y2="256"/>
    <line x1="202" y1="202" x2="208" y2="208"/>
    <line x1="304" y1="304" x2="310" y2="310"/>
    <line x1="202" y1="310" x2="208" y2="304"/>
    <line x1="304" y1="208" x2="310" y2="202"/>
  </g>

  <g stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="192"/>
    <line x1="256" y1="256" x2="200" y2="288"/>
    <line x1="256" y1="256" x2="312" y2="288"/>
  </g>

  <circle cx="256" cy="192" r="12" fill="url(#goldGrad)"/>
  <circle cx="200" cy="288" r="12" fill="url(#goldGrad)"/>
  <circle cx="312" cy="288" r="12" fill="url(#goldGrad)"/>

  <circle cx="256" cy="256" r="28" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="14" fill="#0f172a"/>
</svg>
