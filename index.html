  <script>
    (function createDynamicManifest() {
      const manifestData = {
        "name": "branKAS Web App",
        "short_name": "branKAS",
        "description": "Aplikasi Web branKAS",
        "start_url": "./",
        "display": "standalone",
        "orientation": "any",
        "background_color": "#0f172a",
        "theme_color": "#4f46e5",
        "icons": [
          {
            "src": "https://static.vecteezy.com/system/resources/previews/016/716/181/large_2x/website-3d-icon-png.png",
            "sizes": "192x192 512x512",
            "type": "image/png",
            "purpose": "any maskable"
          }
        ]
      };
      const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(blob);
      document.getElementById('manifestLink').setAttribute('href', manifestUrl);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'brankas-pwa-v1';
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            // Normal pass-through network fetch for live iframe content
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl)
          .then(reg => console.log('PWA ServiceWorker registered standardly'))
          .catch(err => console.warn('PWA ServiceWorker registration error:', err));
      });
    }

    const loader = document.getElementById('loader');
    const appFrame = document.getElementById('appFrame');
    const statusText = document.getElementById('statusText');
    const slowNotice = document.getElementById('slowNotice');
    const offlineBanner = document.getElementById('offlineBanner');

    let isLoaded = false;

    // Fade out splash loader when iframe loads
    appFrame.addEventListener('load', () => {
      isLoaded = true;
      loader.classList.add('hidden');
    });

    function reloadApp() {
      loader.classList.remove('hidden');
      slowNotice.style.display = 'none';
      statusText.innerText = 'Memuat ulang aplikasi...';
      appFrame.src = appFrame.src;
    }

    // Cold-start timer for Google Apps Script (8 seconds)
    setTimeout(() => {
      if (!isLoaded) {
        statusText.innerText = 'Masih memuat...';
        slowNotice.style.display = 'block';
      }
    }, 8000);

    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineBanner.classList.add('active');
      } else {
        offlineBanner.classList.remove('active');
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');
    const btnInstall = document.getElementById('btnInstall');
    const btnDismissInstall = document.getElementById('btnDismissInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent automatic mini-infobar on mobile Chrome
      e.preventDefault();
      deferredPrompt = e;
      // Show our custom branded install prompt banner
      installBanner.classList.add('visible');
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`PWA Install prompt response: ${outcome}`);
        deferredPrompt = null;
        installBanner.classList.remove('visible');
      }
    });

    btnDismissInstall.addEventListener('click', () => {
      installBanner.classList.remove('visible');
    });

    window.addEventListener('appinstalled', () => {
      installBanner.classList.remove('visible');
      deferredPrompt = null;
      console.log('branKAS PWA successfully installed!');
    });
  </script>
