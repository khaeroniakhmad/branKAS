<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>branKAS</title>

  <!-- PWA Fullscreen Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="branKAS">
  
  <!-- Icon Brankas 3D/SVG -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Optimasi Koneksi Cepat -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      overscroll-behavior: none;
    }

    /* Menghilangkan garis putih bawah (efek offset -5px & background senada) */
    .iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: -5px;
      width: 100%;
      height: calc(100% + 5px);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0 !important;
      outline: none !important;
      display: block;
      margin: 0;
      padding: 0;
      vertical-align: bottom;
    }

    /* Loader Instan (Tanpa Animasi Spinner) */
    .loader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div class="loader-wrapper" id="loader">
      <span>Memuat...</span>
    </div>

    <iframe
      src="https://script.google.com/macros/s/AKfycbwgRdiwsB2wWMrLS-PzchLYp6FxkzyV3aBeru76RFzZ4qCyuAFiRoGV9TLO7YgZEQvQ/exec"
      title="branKAS"
      onload="document.getElementById('loader').style.display='none';"
      allow="geolocation; microphone; camera"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
