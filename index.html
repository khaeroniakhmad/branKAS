<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>branKAS</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="branKAS">
  <link rel="apple-touch-icon" href="https://static.vecteezy.com/system/resources/previews/016/716/181/large_2x/website-3d-icon-png.png">

  <!-- Optimization & Fast Loading -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="icon" href="https://static.vecteezy.com/system/resources/previews/016/716/181/large_2x/website-3d-icon-png.png" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      overscroll-behavior: none;
    }

    .iframe-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .loader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #666666;
      font-size: 14px;
      font-weight: 500;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div class="loader-wrapper" id="loader">
      <span>Memuat...</span>
    </div>

    <iframe
      src="https://script.google.com/macros/s/AKfycbzvKOiE0mZDkOrdqHsyYU6L82ZI5dk1rjsnk1K1P2HrAYOiJv6k0o4DgmmBxbgPFgxy/exec"
      title="branKAS"
      onload="document.getElementById('loader').style.display='none';"
      allow="geolocation; microphone; camera"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // Registrasi Service Worker inline minimal agar syarat PWA Chrome terpenuhi
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
